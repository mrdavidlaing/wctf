company_wide_signals:
  total_engineering_headcount: "~3,400 engineers (40% of 8,500 employees)"
  codebase_metrics:
    lines_of_code: "50+ million"
    pull_requests_per_day: "1,145"
    pull_requests_per_week: "8,015"
  team_structure:
    model: "Engineering-centric with cross-functional partners (not traditional squad model)"
    typical_team_composition:
      engineering_manager: "Yes - leads engineering & design processes, coaches team, shapes strategy"
      product_manager: |
        Yes (now) - Historically Stripe had no PMs; engineers did PM work.
        Now have "many PMs" but engineers still expected to be close to users.
        PMs operate as "mini GMs" with high ownership and self-defined scope.
        PMs are partners, not gatekeepers.
      designer: "Yes - engineers collaborate with designers as part of product development"
      tech_lead: |
        Unclear - Staff engineers work across teams rather than embedded as tech leads.
        Staff role is cross-org technical leadership, not team-embedded.
    key_cultural_traits:
      - "Engineers own product decisions - participate in business scope, user research, cross-functional collaboration"
      - "Engineers expected to be close to users and involved end-to-end"
      - "Tight feedback loops between engineering and users"
      - "Engineers collaborate with designers, lawyers, accountants, etc."
    onboarding: "New hires grouped into temporary virtual teams for 3-4 weeks with dedicated mentor"
    reference_team_size: "Will Larson's Foundation Engineering: 170 engineers across Dublin, SF, Seattle, and 18 remote cities"
    sources:
      - "https://newsletter.pragmaticengineer.com/p/stripe-part-2"
      - "https://review.firstround.com/how-to-size-and-assess-teams-from-an-eng-lead-at-stripe-uber-and-digg/"
      - "https://www.quora.com/Does-Stripe-have-product-managers-or-do-engineers-manage-the-products-themselves"
  technical_culture:
    - "World's largest Ruby codebase"
    - "LLM tools allowed for work but not in interviews"
    - "Heavy investment in AI/ML for fraud prevention"
    - "Strong documentation culture (async-first signals)"
  dublin_specific:
    office_size: "7-8 floors (LinkedIn's old building)"
    estimated_headcount: "~1,000"
    status: "Joint headquarters with San Francisco"
    growth_direction: "Two-thirds of future growth outside US"
    work_policy: "50% onsite requirement"

